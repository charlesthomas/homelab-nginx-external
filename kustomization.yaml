---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nginx-external

commonAnnotations:
  repo: https://github.com/charlesthomas/homelab-nginx-external
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: external
    app.kubernetes.io/name: nginx-ingress

resources:
- resources/certificates.yaml
- resources/configmaps.yaml
- resources/deployments.yaml
- resources/ingress-classes.yaml
- resources/namespaces.yaml
- resources/rbac.yaml
- resources/secrets.yaml
- resources/service-accounts.yaml
- resources/services.yaml

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all
      namespace: nginx-external
      annotations:
        reloader.stakater.com/auto: "true"
  target:
    kind: Deployment

configMapGenerator:
- name: grafana-dashboard-nginx-external
  files:
  - grafana/nginx-external.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
